<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coach frames</title>
<!--
  Frames page (SPEC §5). Query parameters:
    anim=<id>       frames of one animation, each seeked to i/(n-1), labelled with its time in ms
    anim=poses      every pose in BraviloMotion.POSES (default)
    anim=variants   every variant of every group, on the rest pose
    anim=all        every registered animation, one block each
    anim=to&from=thinking&to=rest[&ms=220]   the transition play() and stop() generate between poses
    anim=try&poses={"name":{pose},…}   draw trial poses given as JSON (for designing key poses)
    n=<frames>      frames per animation (default 8)
    times=0,90,240  explicit frame times in ms (instead of n)
    theme=light|dark|both   (default light)
    size=<px>       coach size in CSS px (default 112)
    sizes=112,32    several sizes per cell instead of one
    cols=<n>        columns per row (default: wrap to the window)
    info=1          print the variants under each frame
    graph=1         plot every track (value over time, keys as dots, swaps as ticks)
    ref=0           hide the start / end pose cells after the frames
    live=1          add a live preview that plays the animation again and again
-->
<style>
  :root { --light-bg: #F6F5EF; --dark-bg: #151918; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 12px/1.35 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; background: var(--light-bg); color: #1E2220; }
  body.dark { background: var(--dark-bg); }
  section { padding: 10px 16px 12px; background: var(--light-bg); color: #1E2220; }
  section.dark { background: var(--dark-bg); color: #C9D3BF; }
  h1 { margin: 0; font-size: 14px; }
  h2 { margin: 0 0 4px; font-size: 12px; font-weight: 600; }
  .meta { margin: 3px 0 0; opacity: .75; max-width: 1200px; }
  .issues { margin: 6px 0 0; padding: 0; list-style: none; color: #B3261E; font: 11px/1.4 Menlo, monospace; }
  section.dark .issues { color: #FFB4A9; }
  .ok { color: #3D6B1F; font: 11px/1.4 Menlo, monospace; margin-top: 4px; }
  section.dark .ok { color: #A4C584; }
  .row { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: flex-end; margin-top: 8px; }
  .row.grid { display: grid; grid-template-columns: repeat(var(--cols), max-content); }
  .cell { display: flex; flex-direction: column; align-items: center; }
  .cell .coaches { display: flex; gap: 8px; align-items: flex-end; }
  .lbl { font: 11px/1.25 Menlo, monospace; opacity: .78; margin-top: 2px; white-space: nowrap; text-align: center; }
  .lbl.sub { font-size: 10px; opacity: .6; white-space: normal; max-width: 100%; }
  .sep { width: 1px; align-self: stretch; background: currentColor; opacity: .18; margin: 0 6px; }
  .ref .lbl { font-style: italic; }
  .graphs { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 10px; }
  .graph { font: 10px/1.2 Menlo, monospace; }
  .graph svg { display: block; }
  .missing { padding: 8px 16px 14px; font: 11px/1.4 Menlo, monospace; opacity: .6; }
</style>
<script>
  // Which anim files loaded. A missing file (not built yet) must not break the page.
  window.LAB_FILES = { loaded: [], missing: [] };
  function labLoaded(n) { LAB_FILES.loaded.push(n); }
  function labMissing(n) { LAB_FILES.missing.push(n); }
</script>
<script src="vendor/gsap.min.js"></script>
<script src="coach.js"></script>
<script src="motion.js"></script>
<script src="player.js"></script>
<script src="anims/nod.js" onload="labLoaded('nod')" onerror="labMissing('nod')"></script>
<script src="anims/greeting.js" onload="labLoaded('greeting')" onerror="labMissing('greeting')"></script>
<script src="anims/thinking.js" onload="labLoaded('thinking')" onerror="labMissing('thinking')"></script>
<script src="anims/happy.js" onload="labLoaded('happy')" onerror="labMissing('happy')"></script>
<script src="anims/proud.js" onload="labLoaded('proud')" onerror="labMissing('proud')"></script>
<script src="anims/encourage.js" onload="labLoaded('encourage')" onerror="labMissing('encourage')"></script>
<script src="anims/sleepy.js" onload="labLoaded('sleepy')" onerror="labMissing('sleepy')"></script>
<script src="anims/welcomeBack.js" onload="labLoaded('welcomeBack')" onerror="labMissing('welcomeBack')"></script>
<script src="anims/concerned.js" onload="labLoaded('concerned')" onerror="labMissing('concerned')"></script>
<script src="anims/surprised.js" onload="labLoaded('surprised')" onerror="labMissing('surprised')"></script>
<script src="anims/lookAt.js" onload="labLoaded('lookAt')" onerror="labMissing('lookAt')"></script>
<script src="anims/press.js" onload="labLoaded('press')" onerror="labMissing('press')"></script>
<script src="anims/chatOpen.js" onload="labLoaded('chatOpen')" onerror="labMissing('chatOpen')"></script>
</head>
<body>
<script>
(function () {
  'use strict';
  var BC = window.BraviloCoach, BM = window.BraviloMotion, BP = window.BraviloPlayer;
  var q = new URLSearchParams(location.search);
  var mode = q.get('anim') || 'poses';
  var n = Math.max(2, parseInt(q.get('n'), 10) || 8);
  var times = (q.get('times') || '').split(',').filter(function (s) { return s.trim() !== '' && isFinite(+s); }).map(Number);
  var themeQ = q.get('theme') || 'light';
  var themes = themeQ === 'both' ? ['light', 'dark'] : [themeQ === 'dark' ? 'dark' : 'light'];
  var sizes = (q.get('sizes') || '').split(',').map(Number).filter(function (s) { return s > 0; });
  if (!sizes.length) sizes = [Math.max(8, parseInt(q.get('size'), 10) || 112)];
  var cols = parseInt(q.get('cols'), 10) || 0;
  var info = q.get('info') === '1', graph = q.get('graph') === '1', live = q.get('live') === '1';
  var showRef = q.get('ref') !== '0';
  if (themes.length === 1 && themes[0] === 'dark') document.body.classList.add('dark');

  function el(tag, cls, parent, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  }
  function section(theme) { return el('section', theme === 'dark' ? 'dark' : '', document.body); }
  function row(parent) {
    var r = el('div', 'row' + (cols ? ' grid' : ''), parent);
    if (cols) r.style.setProperty('--cols', cols);
    return r;
  }
  // One cell: the coach at every requested size, set up by `setup`, then label lines.
  function cell(parent, theme, setup, labels, cls) {
    var c = el('div', 'cell' + (cls ? ' ' + cls : ''), parent);
    var holder = el('div', 'coaches', c);
    var W = Math.max(56, sizes.reduce(function (a, s) { return a + s + 8; }, -8));
    c.style.minWidth = W + 'px';
    var made = sizes.map(function (s) {
      var h = el('div', '', holder);
      var coach = BC.create(h, { theme: theme, size: s });
      setup(coach);
      return coach;
    });
    (labels || []).forEach(function (t, i) {
      if (!t) return;
      var l = el('div', 'lbl' + (i ? ' sub' : ''), c, t);
      if (i) l.style.width = W + 'px'; // the info line wraps inside the coach's width
    });
    return made;
  }
  function variantText(v) {
    return ['eyes', 'mouth', 'brows', 'fx'].map(function (g) { return v[g]; }).join(' · ');
  }
  function poseName(p) { return typeof p === 'string' ? p : (p && p.name) || 'custom'; }

  // ------------------------------------------------------------ engine check
  // The timeline state after seek must equal the pure spec sample, and every part's drawn
  // transform must equal translate(x, y) rotate scale about its pivot.
  function engineCheck(coach, spec, tMs) {
    var got = BP.state(coach), want = BP.sample(spec, tMs), problems = [];
    BP.PARTS.forEach(function (p) {
      BP.PROPS.forEach(function (k) {
        var d = Math.abs(got.parts[p][k] - want.parts[p][k]);
        if (d > 1e-3) problems.push(p + '.' + k + ' ' + got.parts[p][k].toFixed(3) + ' vs ' + want.parts[p][k].toFixed(3));
      });
      var s = got.parts[p], pv = BC.PIVOTS[p], g = coach.parts[p];
      var m = new DOMMatrix().translate(pv[0] + s.x, pv[1] + s.y).rotate(s.rotate)
        .scale(s.scale * s.scaleX, s.scale * s.scaleY).translate(-pv[0], -pv[1]);
      var tl = g.transform.baseVal.consolidate(), a = tl ? tl.matrix : new DOMMatrix();
      var err = Math.max(Math.abs(a.a - m.a), Math.abs(a.b - m.b), Math.abs(a.c - m.c), Math.abs(a.d - m.d),
        Math.abs(a.e - m.e) / 100, Math.abs(a.f - m.f) / 100);
      if (err > 2e-3) problems.push(p + ' drawn transform off by ' + err.toFixed(4));
    });
    BP.GROUPS.forEach(function (gname) {
      if (coach.variants[gname] !== want.variants[gname]) problems.push(gname + ' "' + coach.variants[gname] + '" vs "' + want.variants[gname] + '"');
    });
    return problems;
  }

  // ------------------------------------------------------------ track graphs
  function graphs(parent, spec) {
    var box = el('div', 'graphs', parent), D = BP.durationOf(spec), W = 200, H = 54;
    (spec.tracks || []).forEach(function (tr) {
      var vals = [], i, N = 120;
      for (i = 0; i <= N; i++) vals.push(BP.sample(spec, D * i / N).parts[tr.part][tr.prop]);
      var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
      if (hi - lo < 1e-9) { hi += 0.5; lo -= 0.5; }
      function X(t) { return 4 + (W - 8) * t / D; }
      function Y(v) { return 6 + (H - 12) * (1 - (v - lo) / (hi - lo)); }
      var g = el('div', 'graph', box);
      el('div', '', g, tr.part + '.' + tr.prop + '  ' + lo.toFixed(2) + ' … ' + hi.toFixed(2));
      var pts = vals.map(function (v, j) { return X(D * j / N).toFixed(1) + ',' + Y(v).toFixed(1); }).join(' ');
      var dots = (tr.keys || []).map(function (k) {
        return '<circle cx="' + X(k[0]).toFixed(1) + '" cy="' + Y(k[1]).toFixed(1) + '" r="2.4" fill="currentColor"/>';
      }).join('');
      g.insertAdjacentHTML('beforeend', '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">' +
        '<rect x=".5" y=".5" width="' + (W - 1) + '" height="' + (H - 1) + '" fill="none" stroke="currentColor" stroke-opacity=".2"/>' +
        '<polyline points="' + pts + '" fill="none" stroke="currentColor" stroke-width="1.4"/>' + dots + '</svg>');
    });
    if ((spec.swaps || []).length) {
      var g = el('div', 'graph', box);
      el('div', '', g, 'swaps');
      var ticks = spec.swaps.map(function (s) {
        var x = (4 + (W - 8) * s[0] / D).toFixed(1);
        return '<line x1="' + x + '" x2="' + x + '" y1="6" y2="' + (H - 18) + '" stroke="currentColor"/>' +
          '<text x="' + x + '" y="' + (H - 6) + '" font-size="8" text-anchor="middle" fill="currentColor">' + s[1][0] + ':' + s[2] + '</text>';
      }).join('');
      g.insertAdjacentHTML('beforeend', '<svg width="' + W + '" height="' + H + '"><rect x=".5" y=".5" width="' + (W - 1) + '" height="' + (H - 1) + '" fill="none" stroke="currentColor" stroke-opacity=".2"/>' + ticks + '</svg>');
    }
  }

  // ------------------------------------------------------------ one animation
  function animBlock(id, theme, withHeader) {
    var spec = typeof id === 'object' ? id : BM.ANIMS[id], sec = section(theme);
    if (typeof id === 'object') id = id.id;
    if (!spec) {
      el('h1', '', sec, id + ': not registered');
      el('p', 'meta', sec, LAB_FILES.missing.length ? 'Missing files: ' + LAB_FILES.missing.join(', ') : '');
      return;
    }
    var D = BP.durationOf(spec);
    if (withHeader) {
      el('h1', '', sec, id + (spec.label ? ' · ' + spec.label : ''));
      el('p', 'meta', sec, [D + ' ms' + (spec.loop ? ' loop' : ''),
        poseName(spec.startPose || 'rest') + ' → ' + poseName(spec.endPose),
        spec.where ? 'where: ' + spec.where : '', spec.feel ? 'feel: ' + spec.feel : ''].filter(Boolean).join('   ·   '));
      var issues = BP.validate(spec);
      if (issues.length) {
        var ul = el('ul', 'issues', sec);
        issues.forEach(function (m) { el('li', '', ul, '✗ ' + m); console.warn('[frames] ' + id + ': ' + m); });
      } else {
        el('div', 'ok', sec, '✓ spec follows SPEC §3 (starts on its start pose, ends on ' + poseName(spec.endPose) + ')');
      }
    } else {
      el('h2', '', sec, id + ' · ' + theme);
    }
    var r = row(sec), ts = times.length ? times : [];
    if (!ts.length) for (var i = 0; i < n; i++) ts.push(D * i / (n - 1));
    var bad = [];
    ts.forEach(function (t) {
      var p = D > 0 ? Math.max(0, Math.min(1, t / D)) : 0;
      cell(r, theme, function (coach) {
        var tMs = BP.seek(coach, spec, p);
        var pr = engineCheck(coach, spec, tMs);
        if (pr.length) bad.push(Math.round(tMs) + ' ms: ' + pr.slice(0, 3).join('; '));
      }, [Math.round(t) + ' ms', info ? variantText(BP.sample(spec, t).variants) : '']);
    });
    if (showRef) {
      el('div', 'sep', r);
      cell(r, theme, function (c) { BP.apply(c, spec.startPose || 'rest'); }, ['start: ' + poseName(spec.startPose || 'rest')], 'ref');
      cell(r, theme, function (c) { BP.apply(c, spec.endPose || 'rest'); }, ['end: ' + poseName(spec.endPose)], 'ref');
    }
    if (withHeader) {
      if (bad.length) {
        var ul2 = el('ul', 'issues', sec);
        bad.forEach(function (m) { el('li', '', ul2, '✗ engine: ' + m); console.warn('[frames] engine ' + id + ' at ' + m); });
      } else {
        el('div', 'ok', sec, '✓ engine: timeline = spec sample and drawn transforms = pivots at all ' + ts.length + ' frames');
      }
    }
    if (graph && withHeader) graphs(sec, spec);
    if (live && withHeader) liveBlock(sec, theme, id, spec);
  }

  function liveBlock(sec, theme, id, spec) {
    el('h2', '', sec, 'live').style.marginTop = '10px';
    var r = row(sec);
    cell(r, theme, function (coach) {
      function again() {
        BP.play(coach, spec, { onDone: function () { setTimeout(again, 700); } });
        if (spec.loop) setTimeout(function () { BP.stop(coach, { onDone: function () { setTimeout(again, 700); } }); }, 3 * BP.durationOf(spec));
      }
      again();
    }, ['playing']);
  }

  // ------------------------------------------------------------ modes
  if (mode === 'poses') {
    themes.forEach(function (theme) {
      var sec = section(theme);
      el('h1', '', sec, 'Poses · ' + theme);
      var r = row(sec);
      Object.keys(BM.POSES).forEach(function (name) {
        cell(r, theme, function (c) { BP.apply(c, name); }, [name, info ? variantText(BP.poseState(name).variants) : '']);
      });
    });
  } else if (mode === 'variants') {
    themes.forEach(function (theme) {
      var sec = section(theme);
      el('h1', '', sec, 'Variants · ' + theme + ' (on the rest pose)');
      Object.keys(BC.VARIANTS).forEach(function (group) {
        el('h2', '', sec, group).style.marginTop = '8px';
        var r = row(sec);
        BC.VARIANTS[group].forEach(function (v) {
          cell(r, theme, function (c) { BP.apply(c, 'rest'); c.setVariant(group, v); }, [group + ': ' + v]);
        });
      });
    });
  } else if (mode === 'try') {
    var trial = {};
    try { trial = JSON.parse(q.get('poses') || '{}'); } catch (e) { console.warn('[frames] poses is not valid JSON: ' + e.message); }
    if (Array.isArray(trial)) trial = trial.reduce(function (o, p, i) { o['#' + (i + 1)] = p; return o; }, {});
    themes.forEach(function (theme) {
      var sec = section(theme);
      el('h1', '', sec, 'Trial poses · ' + theme);
      var r = row(sec);
      Object.keys(trial).forEach(function (name) {
        cell(r, theme, function (c) { BP.apply(c, trial[name]); }, [name]);
      });
    });
  } else if (mode === 'to') {
    // The settle / stop transition the player generates between two poses.
    var from = q.get('from') || 'rest', toP = q.get('to') || 'rest';
    var tspec = BP.transitionSpec(from, toP, parseInt(q.get('ms'), 10) || BM.TOKENS.ms.base);
    tspec.id = 'to';
    tspec.where = 'the player: play() settling to a start pose, stop() returning to an end pose';
    tspec.feel = 'a quick, quiet change of pose';
    tspec.label = from + ' → ' + toP + ' (the transition play() settles with and stop() returns with)';
    themes.forEach(function (theme, i) { animBlock(tspec, theme, i === 0); });
  } else if (mode === 'all') {
    Object.keys(BM.ANIMS).forEach(function (id) {
      themes.forEach(function (theme, i) { animBlock(id, theme, i === 0); });
    });
    if (!Object.keys(BM.ANIMS).length) el('h1', '', section(themes[0]), 'No animations registered yet');
  } else {
    themes.forEach(function (theme, i) { animBlock(mode, theme, i === 0); });
  }

  if (LAB_FILES.missing.length) {
    el('div', 'missing', document.body, 'Not built yet (anims/*.js missing): ' + LAB_FILES.missing.join(', '));
  }
})();
</script>
</body>
</html>
