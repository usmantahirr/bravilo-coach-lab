<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coach sheet, candidate 1</title>
<style>
  :root { --light-bg: #F6F5EF; --dark-bg: #151918; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 12px/1.3 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; background: var(--light-bg); color: #1E2220; }
  section { padding: 14px 20px 10px; }
  section.dark { background: var(--dark-bg); color: #C9D3BF; }
  h2 { margin: 0 0 6px; font-size: 13px; font-weight: 600; }
  .row { display: flex; flex-wrap: wrap; gap: 6px 4px; align-items: flex-end; }
  .cell { display: flex; flex-direction: column; align-items: center; min-width: 116px; }
  .cell .lbl { font-size: 11px; opacity: .7; margin-top: 2px; }
  .sizes { gap: 6px 22px; }
  .sizes .cell { min-width: 0; }
</style>
</head>
<body>
<section id="A"><h2>A · light · rest pose, then each eye variant (112 px)</h2><div class="row"></div></section>
<section id="B"><h2>B · light · composed expressions (112 px)</h2><div class="row"></div></section>
<section id="C" class="dark"><h2>C · dark · rest pose, then each eye variant (112 px)</h2><div class="row"></div></section>
<section id="D" class="dark"><h2>D · dark · composed expressions (112 px)</h2><div class="row"></div></section>
<section id="E1"><h2>E · light · sizes (rest, then happy)</h2><div class="row sizes"></div></section>
<section id="E2" class="dark"><h2>E · dark · sizes (rest, then happy)</h2><div class="row sizes"></div></section>

<script src="./coach.js"></script>
<script>
(function () {
  var BC = window.BraviloCoach;

  // Mock expressions: variants plus temporary transforms on the part groups around PIVOTS.
  var MOCK = {
    rest: {},
    happy: { eyes: 'happy', mouth: 'smile',
      parts: { body: { y: -2 }, handL: { x: -8, y: -64, rotate: -14 }, handR: { x: 8, y: -64, rotate: 14 } } },
    proud: { eyes: 'happy', mouth: 'open', fx: 'spark',
      parts: { body: { scaleX: 0.985, scaleY: 1.03 }, handR: { x: 17, y: -115, rotate: 10 }, handL: { x: 2, y: -4, rotate: -6 } } },
    encourage: { eyes: 'happy',
      parts: { body: { rotate: 2 }, handR: { x: -24, y: -8, rotate: -8, scale: 1.22 } } },
    thinking: { eyes: 'up', brows: 'think', fx: 'dots',
      parts: { handR: { x: -42, y: -4, rotate: -15 } } },
    sleepy: { eyes: 'closed', fx: 'zzz',
      parts: { body: { scaleY: 0.98 }, handL: { y: 2 }, handR: { y: 2 } } },
    concerned: { eyes: 'rest', brows: 'worried', mouth: 'soft',
      parts: { body: { rotate: -3 }, handL: { x: -3, y: -30, rotate: 12 } } },
    surprised: { eyes: 'wide', mouth: 'o', brows: 'raised',
      parts: { body: { y: -4, scaleY: 1.03 }, handL: { x: -10, y: -30, rotate: -22 }, handR: { x: 10, y: -30, rotate: 22 } } }
  };

  function transformFor(part, t) {
    var p = BC.PIVOTS[part];
    var x = t.x || 0, y = t.y || 0, r = t.rotate || 0;
    var sx = t.scaleX != null ? t.scaleX : (t.scale != null ? t.scale : 1);
    var sy = t.scaleY != null ? t.scaleY : (t.scale != null ? t.scale : 1);
    return 'translate(' + (x + p[0]) + ' ' + (y + p[1]) + ') rotate(' + r + ') scale(' + sx + ' ' + sy + ') translate(' + (-p[0]) + ' ' + (-p[1]) + ')';
  }

  function applyMock(coach, pose) {
    ['eyes', 'mouth', 'brows', 'fx'].forEach(function (g) {
      coach.setVariant(g, pose[g] || { eyes: 'rest', mouth: 'none', brows: 'none', fx: 'none' }[g]);
    });
    var parts = pose.parts || {};
    Object.keys(parts).forEach(function (k) { coach.parts[k].setAttribute('transform', transformFor(k, parts[k])); });
  }

  function cell(row, label, theme, size, setup) {
    var c = document.createElement('div'); c.className = 'cell';
    var holder = document.createElement('div'); c.appendChild(holder);
    var coach = BC.create(holder, { theme: theme, size: size });
    if (setup) setup(coach);
    var l = document.createElement('div'); l.className = 'lbl'; l.textContent = label; c.appendChild(l);
    row.appendChild(c);
    return coach;
  }

  function eyeRow(id, theme) {
    var row = document.querySelector('#' + id + ' .row');
    cell(row, 'rest pose', theme, 112);
    BC.VARIANTS.eyes.forEach(function (v) {
      cell(row, 'eyes: ' + v, theme, 112, function (c) { c.setVariant('eyes', v); });
    });
  }

  function mockRow(id, theme) {
    var row = document.querySelector('#' + id + ' .row');
    Object.keys(MOCK).forEach(function (name) {
      cell(row, name, theme, 112, function (c) { applyMock(c, MOCK[name]); });
    });
  }

  function sizeRow(id, theme) {
    var row = document.querySelector('#' + id + ' .row');
    [24, 32, 48, 56, 112, 180].forEach(function (s) {
      cell(row, s + ' px' + (s < BC.SMALL_BELOW ? ' (small)' : ''), theme, s);
    });
    [24, 32, 48].forEach(function (s) {
      cell(row, s + ' happy', theme, s, function (c) { applyMock(c, MOCK.happy); });
    });
  }

  // ?focus=rest,happy&size=300&theme=dark draws only those poses, big, for close checks.
  var q = new URLSearchParams(location.search);
  if (q.get('selftest')) {
    // Contract self-check (SPEC §2). Prints PASS/FAIL lines into the page.
    var out = [], ok = function (c, m) { out.push((c ? 'PASS ' : 'FAIL ') + m); };
    document.querySelectorAll('section').forEach(function (s) { s.remove(); });
    var host = document.createElement('div'); document.body.appendChild(host);
    var c = BC.create(host, { theme: 'light', size: 112 });
    var need = ['root', 'body', 'face', 'eyes', 'mouth', 'brows', 'handL', 'handR', 'fx', 'shadow'];
    need.forEach(function (p) {
      ok(c.parts[p] && c.parts[p].getAttribute('data-part') === p, 'part ' + p);
      ok(Array.isArray(BC.PIVOTS[p]) && BC.PIVOTS[p].length === 2, 'pivot ' + p);
      ok(c.parts[p] && !c.parts[p].hasAttribute('transform'), 'identity transform at rest ' + p);
    });
    ok(c.parts.shadow.parentNode === c.svg && c.parts.root.contains(c.parts.handL) && !c.parts.body.contains(c.parts.handL), 'tree: shadow outside root, hands outside body');
    ['eyes', 'mouth', 'brows'].forEach(function (p) { ok(c.parts.body.contains(c.parts[p]), p + ' inside body'); });
    var req = { eyes: ['rest', 'happy', 'wide', 'closed', 'up', 'left', 'right', 'down'], mouth: ['none', 'smile', 'open', 'o', 'soft'],
      brows: ['none', 'raised', 'worried', 'think'], fx: ['none', 'dots', 'zzz', 'spark'] };
    Object.keys(req).forEach(function (g) {
      req[g].forEach(function (v) {
        ok(c.setVariant(g, v), 'setVariant ' + g + ' ' + v);
        var vis = Array.prototype.filter.call(c.parts[g].children, function (k) { return k.hasAttribute('data-variant') && k.getAttribute('display') !== 'none'; });
        ok(vis.length === 1 && vis[0].getAttribute('data-variant') === v, 'exactly one visible ' + g + ' ' + v);
      });
    });
    ok(!c.svg.querySelector('text,filter,mask,linearGradient,radialGradient,clipPath'), 'no text, filters, masks, gradients, clipPaths');
    var badColour = Array.prototype.some.call(c.svg.querySelectorAll('path'), function (e) {
      var st = e.getAttribute('style') || ''; return /#|rgb/.test(st) || e.hasAttribute('fill') || e.hasAttribute('stroke');
    });
    ok(!badColour, 'colours only through CSS variables');
    c.setTheme('dark'); ok(c.svg.style.getPropertyValue('--coach-hood').trim() === '#2A302C', 'setTheme dark');
    c.setSize(24); ok(c.small && c.parts.brows.getAttribute('display') === 'none' && c.parts.fx.getAttribute('display') === 'none', 'small mode hides brows and fx');
    ok(c.svg.querySelector('[data-variant="rest"] [data-set="small"]').getAttribute('display') !== 'none', 'small eye set shown at 24');
    c.setSize(112); ok(!c.small && !c.parts.brows.hasAttribute('display'), 'back to regular at 112');
    var bb = c.parts.root.getBBox(); ok(bb.x >= 0 && bb.y >= 0 && bb.x + bb.width <= 240 && bb.y + bb.height <= 240, 'rest pose inside the viewBox ' + [bb.x, bb.y, bb.width, bb.height].map(Math.round).join(','));
    Object.keys(MOCK).forEach(function (name) {
      var h = document.createElement('div'); document.body.appendChild(h);
      var m = BC.create(h, { size: 112 }); applyMock(m, MOCK[name]);
      var r = m.svg.getBoundingClientRect(), worst = 0;
      m.svg.querySelectorAll('path').forEach(function (e) {
        if (e.closest('[display="none"]')) return;
        var b = e.getBoundingClientRect();
        worst = Math.max(worst, r.left - b.left, r.top - b.top, b.right - r.right, b.bottom - r.bottom);
      });
      ok(worst <= 0.5, 'mock ' + name + ' inside the viewBox (overflow ' + worst.toFixed(1) + ' px)');
      h.remove();
    });
    var pre = document.createElement('pre'); pre.id = 'selftest'; pre.textContent = out.join('\n'); document.body.appendChild(pre);
  } else if (q.get('focus')) {
    document.querySelectorAll('section').forEach(function (s) { s.remove(); });
    var theme = q.get('theme') || 'light', size = +(q.get('size') || 300);
    var sec = document.createElement('section'); if (theme === 'dark') sec.className = 'dark';
    var row = document.createElement('div'); row.className = 'row'; sec.appendChild(row); document.body.appendChild(sec);
    document.body.style.background = theme === 'dark' ? '#151918' : '#F6F5EF';
    q.get('focus').split(',').forEach(function (name) {
      var parts = name.split(':');
      cell(row, name, theme, size, function (c) {
        if (parts[0] === 'eyes') c.setVariant('eyes', parts[1]);
        else if (MOCK[name]) applyMock(c, MOCK[name]);
      });
    });
  } else {
    eyeRow('A', 'light'); mockRow('B', 'light');
    eyeRow('C', 'dark'); mockRow('D', 'dark');
    sizeRow('E1', 'light'); sizeRow('E2', 'dark');
  }
  window.__SHEET = { MOCK: MOCK, applyMock: applyMock };
})();
</script>
</body>
</html>
