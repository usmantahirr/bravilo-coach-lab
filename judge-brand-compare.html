<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Retired: judge-brand compare</title>
<style>
  body { margin: 0; font: 12px/1.3 -apple-system, sans-serif; background: #F6F5EF; color: #1E2220; }
  section { padding: 10px 16px; }
  .dark { background: #151918; color: #C9D3BF; }
  h2 { margin: 0 0 6px; font-size: 13px; }
  .row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
  .cell { display: flex; flex-direction: column; align-items: center; }
  .lbl { font-size: 11px; opacity: .7; }
  img.ref { height: 200px; }
  .dock { display: flex; align-items: center; gap: 12px; padding: 8px 14px; border-radius: 30px; }
  .bubble { padding: 10px 14px; border-radius: 14px; max-width: 260px; font-size: 14px; }
</style>
</head>
<body>
<div role="note" style="position:sticky;top:0;z-index:100;margin:0;padding:12px 16px;background:#7A3E0C;color:#FFF4E5;font:600 15px/1.4 -apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif">Retired candidates, not the final coach. This page draws the candidates the judges compared (candidates/cand-*), kept only as a record. The coach for review is in index.html.</div>
<script src="candidates/cand-1/coach.js"></script>
<script>window.C1 = window.BraviloCoach;</script>
<script src="candidates/cand-3/coach.js"></script>
<script>window.C3 = window.BraviloCoach;</script>
<div id="root"></div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var mode = q.get('mode') || 'big';
  var size = +(q.get('size') || 200);
  var root = document.getElementById('root');

  function tf(BC, part, t) {
    var p = BC.PIVOTS[part];
    var x = t.x || 0, y = t.y || 0, r = t.rotate || 0;
    var sx = t.scaleX != null ? t.scaleX : (t.scale != null ? t.scale : 1);
    var sy = t.scaleY != null ? t.scaleY : (t.scale != null ? t.scale : 1);
    return 'translate(' + (x + p[0]) + ' ' + (y + p[1]) + ') rotate(' + r + ') scale(' + sx + ' ' + sy + ') translate(' + (-p[0]) + ' ' + (-p[1]) + ')';
  }
  // the candidates' own mock poses, copied from their sheets (normalized keys)
  var MOCK1 = {
    rest: {},
    happy: { eyes: 'happy', mouth: 'smile', parts: { body: { y: -2 }, handL: { x: -8, y: -64, rotate: -14 }, handR: { x: 8, y: -64, rotate: 14 } } },
    proud: { eyes: 'happy', mouth: 'open', fx: 'spark', parts: { body: { scaleX: 0.985, scaleY: 1.03 }, handR: { x: 17, y: -115, rotate: 10 }, handL: { x: 2, y: -4, rotate: -6 } } },
    encourage: { eyes: 'happy', parts: { body: { rotate: 2 }, handR: { x: -24, y: -8, rotate: -8, scale: 1.22 } } },
    thinking: { eyes: 'up', brows: 'think', fx: 'dots', parts: { handR: { x: -42, y: -4, rotate: -15 } } },
    sleepy: { eyes: 'closed', fx: 'zzz', parts: { body: { scaleY: 0.98 }, handL: { y: 2 }, handR: { y: 2 } } },
    concerned: { eyes: 'rest', brows: 'worried', mouth: 'soft', parts: { body: { rotate: -3 }, handL: { x: -3, y: -30, rotate: 12 } } },
    surprised: { eyes: 'wide', mouth: 'o', brows: 'raised', parts: { body: { y: -4, scaleY: 1.03 }, handL: { x: -10, y: -30, rotate: -22 }, handR: { x: 10, y: -30, rotate: 22 } } }
  };
  var MOCK3 = {
    rest: {},
    happy: { eyes: 'happy', mouth: 'smile', parts: { handL: { x: -9, y: -78, rotate: -22 }, handR: { x: 9, y: -78, rotate: 22 }, body: { scaleY: 1.01 } } },
    proud: { eyes: 'happy', mouth: 'open', fx: 'spark', parts: { handR: { x: 6, y: -138, rotate: 10 }, handL: { x: 2, y: -8, rotate: -6 }, body: { scaleY: 1.03, scaleX: 0.99 } } },
    encourage: { eyes: 'happy', parts: { handR: { x: -40, y: -10, rotate: -12, scale: 1.18 }, body: { rotate: -2 } } },
    thinking: { eyes: 'up', brows: 'think', fx: 'dots', parts: { handR: { x: -51, y: -19, rotate: -25 }, face: { x: 2, y: -2 } } },
    sleepy: { eyes: 'closed', fx: 'zzz', parts: { body: { scaleY: 0.97, scaleX: 1.01 }, handL: { y: 3 }, handR: { y: 3 } } },
    concerned: { eyes: 'rest', brows: 'worried', mouth: 'soft', parts: { body: { rotate: -3 }, handL: { x: 10, y: -44, rotate: 8 } } },
    surprised: { eyes: 'wide', mouth: 'o', brows: 'raised', parts: { body: { scaleY: 1.04, scaleX: 0.98 }, handL: { x: -4, y: -30, rotate: -22 }, handR: { x: 4, y: -30, rotate: 22 } } }
  };
  function make(BC, mock, holder, theme, sz, name, extra) {
    var c = BC.create(holder, { theme: theme, size: sz });
    var m = mock[name] || {};
    ['eyes', 'mouth', 'brows', 'fx'].forEach(function (g) {
      c.setVariant(g, m[g] || { eyes: 'rest', mouth: 'none', brows: 'none', fx: 'none' }[g]);
    });
    var parts = m.parts || {};
    Object.keys(parts).forEach(function (k) { c.parts[k].setAttribute('transform', tf(BC, k, parts[k])); });
    if (extra) extra(c);
    return c;
  }
  function section(title, dark) {
    var s = document.createElement('section'); if (dark) s.className = 'dark';
    var h = document.createElement('h2'); h.textContent = title; s.appendChild(h);
    var r = document.createElement('div'); r.className = 'row'; s.appendChild(r);
    root.appendChild(s); return r;
  }
  function cell(row, label) {
    var c = document.createElement('div'); c.className = 'cell';
    var h = document.createElement('div'); c.appendChild(h);
    var l = document.createElement('div'); l.className = 'lbl'; l.textContent = label; c.appendChild(l);
    row.appendChild(c); return h;
  }
  var names = (q.get('poses') || 'rest,happy,proud,concerned,thinking,surprised').split(',');
  var cands = [['cand-1', C1, MOCK1], ['cand-3', C3, MOCK3]];

  if (mode === 'big') {
    ['light', 'dark'].forEach(function (theme) {
      cands.forEach(function (cd) {
        var row = section(cd[0] + ' · ' + theme, theme === 'dark');
        names.forEach(function (n) { make(cd[1], cd[2], cell(row, n), theme, size, n); });
      });
    });
  } else if (mode === 'refs') {
    var row = section('references: A (base), C (warmth), today\'s Fold');
    ['ref/dir-A-fold-evolved.png', 'ref/dir-C-hoodie.png', 'ref/fold-ref.png'].forEach(function (src) {
      var i = document.createElement('img'); i.src = src; i.className = 'ref'; cell(row, src).appendChild(i);
    });
    cands.forEach(function (cd) {
      var r2 = section(cd[0] + ' rest / happy / thinking at 200');
      ['rest', 'happy', 'thinking', 'sleepy'].forEach(function (n) { make(cd[1], cd[2], cell(r2, n), 'light', 200, n); });
    });
  } else if (mode === 'context') {
    ['light', 'dark'].forEach(function (theme) {
      var dark = theme === 'dark';
      var row = section('in context · ' + theme, dark);
      cands.forEach(function (cd) {
        var h = cell(row, cd[0] + ' coach line 48');
        var wrap = document.createElement('div'); wrap.style.display = 'flex'; wrap.style.gap = '10px'; wrap.style.alignItems = 'flex-end';
        h.appendChild(wrap);
        var a = document.createElement('div'); wrap.appendChild(a);
        make(cd[1], cd[2], a, theme, 48, 'rest');
        var b = document.createElement('div'); b.className = 'bubble'; b.textContent = 'Rest is where the progress happens. A walk counts too.';
        b.style.background = dark ? '#232A26' : '#E5EDD9'; b.style.color = dark ? '#E8EDE3' : '#1E2220';
        wrap.appendChild(b);
      });
      cands.forEach(function (cd) {
        var h = cell(row, cd[0] + ' tab dock 24 / 32');
        var dock = document.createElement('div'); dock.className = 'dock';
        dock.style.background = dark ? '#1F2522' : '#FFFFFF'; dock.style.border = dark ? '1px solid #2c332f' : '1px solid #e2e0d8';
        var pill = document.createElement('div'); pill.style.cssText = 'width:120px;height:28px;border-radius:14px;background:' + (dark ? '#2a312d' : '#EEF2E2');
        dock.appendChild(pill);
        var a = document.createElement('div'); dock.appendChild(a); make(cd[1], cd[2], a, theme, 24, 'rest');
        var b2 = document.createElement('div'); dock.appendChild(b2); make(cd[1], cd[2], b2, theme, 32, 'happy');
        h.appendChild(dock);
      });
    });
  } else if (mode === 'small') {
    var sz2 = +(q.get('size') || 24);
    ['light', 'dark'].forEach(function (theme) {
      cands.forEach(function (cd) {
        var row = section(cd[0] + ' ' + theme + ' @' + sz2, theme === 'dark');
        ['rest', 'happy', 'proud', 'surprised', 'concerned', 'thinking', 'sleepy'].forEach(function (n) {
          make(cd[1], cd[2], cell(row, n), theme, sz2, n);
        });
      });
    });
  } else if (mode === 'grey') {
    // greyscale value check: show at 160 with CSS grayscale on both themes
    ['light', 'dark'].forEach(function (theme) {
      var row = section('greyscale value check · ' + theme, theme === 'dark');
      cands.forEach(function (cd) {
        ['rest', 'happy'].forEach(function (n) {
          var h = cell(row, cd[0] + ' ' + n); h.style.filter = 'grayscale(1)';
          make(cd[1], cd[2], h, theme, 160, n);
        });
      });
    });
  }
})();
</script>
</body>
</html>
